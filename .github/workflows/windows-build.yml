name: zero-windows-build
# ZERO Windows uygulamasi (firefox.exe iceren zip) uretir.
# Kullanim: GitHub repo sayfasi -> Actions -> zero-windows-build -> Run workflow.
# Bitince Artifacts'tan zero-windows.zip indir, ac, firefox.exe calistir.
# NOT: imzasiz build oldugu icin SmartScreen uyarir -> "Run anyway" de.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360
    defaults:
      run:
        shell: powershell
    steps:
      - name: ZERO reposu
        uses: actions/checkout@v5
        with:
          path: zero

      - name: Arac kur (hg, node)
        run: |
          $ErrorActionPreference = 'Stop'
          pip install mercurial
          where.exe hg
          node --version
          npm --version
          Test-Path "$env:GITHUB_WORKSPACE/zero/firefox-fork/mozconfig-windows" -ErrorAction Stop | Out-Null

      - name: ESR kaynagi
        run: |
          $ErrorActionPreference = 'Stop'
          hg clone https://hg.mozilla.org/releases/mozilla-esr128 firefox-esr
          if (-not (Test-Path firefox-esr/browser/app/profile/firefox.js)) { throw "clone eksik gorunuyor" }

      - name: Newtab derle + XPI paketle
        run: |
          $ErrorActionPreference = 'Stop'
          cd zero/newtab
          npm install --no-audit --no-fund
          npm run build
          if (-not (Test-Path dist/index.html)) { throw "newtab dist uretilmedi" }
          cd ../extension
          Remove-Item -Recurse -Force dist -ErrorAction SilentlyContinue
          Copy-Item -Recurse ../newtab/dist dist
          Remove-Item zero-newtab@example.com.xpi -ErrorAction SilentlyContinue
          Compress-Archive -Path manifest.json,background.js,newtab-override.js,dist -DestinationPath "zero-newtab@example.com.xpi"
          if (-not (Test-Path "zero-newtab@example.com.xpi")) { throw "XPI olusmadi" }
          cd $env:GITHUB_WORKSPACE

      - name: MozillaBuild kur
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path C:\mozilla-build)) {
            Invoke-WebRequest -Uri https://ftp.mozilla.org/pub/mozilla.org/mozilla/libraries/win32/MozillaBuildSetup-Latest.exe -OutFile $env:RUNNER_TEMP\mb-setup.exe
            Start-Process $env:RUNNER_TEMP\mb-setup.exe -ArgumentList '/S' -Wait
          }
          $bash = Get-ChildItem -Recurse -Path C:\mozilla-build -Filter bash.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'usr\\bin' } | Select-Object -First 1
          if (-not $bash) { throw "mozilla-build bash bulunamadi" }
          $bash.FullName | Set-Content $env:RUNNER_TEMP\moz-bash.txt
          Get-Content $env:RUNNER_TEMP\moz-bash.txt

      - name: Derle + paketle (MozillaBuild)
        run: |
          $ErrorActionPreference = 'Stop'
          $bash = Get-Content $env:RUNNER_TEMP\moz-bash.txt
          $env:ZERO_WS = ($env:GITHUB_WORKSPACE -replace '\\','/')
          & $bash --login -c 'bash "$ZERO_WS/zero/firefox-fork/scripts/ci-windows-build.sh" "$ZERO_WS"'

      - name: Distribution ekle + yukle
        run: |
          $ErrorActionPreference = 'Stop'
          cd firefox-esr
          $zip = Get-ChildItem -Recurse obj-zero/dist -Filter "firefox-*.zip" | Select-Object -First 1
          if (-not $zip) { Get-ChildItem obj-zero/dist; throw "paket zip bulunamadi" }
          $tmp = "$env:RUNNER_TEMP/zero-pkg"
          Remove-Item -Recurse -Force $tmp -ErrorAction SilentlyContinue
          Expand-Archive $zip.FullName $tmp
          $fw = Get-ChildItem $tmp -Directory | Select-Object -First 1
          if (-not (Test-Path "$($fw.FullName)/firefox.exe")) { throw "pakette firefox.exe yok" }
          New-Item -ItemType Directory -Force "$($fw.FullName)/distribution/extensions" | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE/zero/extension/zero-newtab@example.com.xpi" "$($fw.FullName)/distribution/extensions/" -Force
          if (-not (Test-Path "$($fw.FullName)/distribution/extensions/zero-newtab@example.com.xpi")) { throw "XPI kopyalanamadi" }
          Set-Content "$($fw.FullName)/distribution/policies.json" @'
          {
            "policies": {
              "DisableTelemetry": true,
              "DisableFirefoxStudies": true,
              "DisablePocket": true,
              "SearchEngines": { "Default": "DuckDuckGo" },
              "Homepage": { "URL": "about:newtab", "Locked": false }
            }
          }
          '@
          Compress-Archive -Path "$($fw.FullName)" -DestinationPath "$env:RUNNER_TEMP/zero-windows.zip" -Force
          $size = (Get-Item "$env:RUNNER_TEMP/zero-windows.zip").Length
          Write-Output "zero-windows.zip: $([math]::Round($size/1MB)) MB"
          if ($size -lt 50MB) { throw "paket supheli derecede kucuk ($size bayt)" }
          cd $env:GITHUB_WORKSPACE

      - name: Yukle
        uses: actions/upload-artifact@v4
        with:
          name: zero-windows
          path: ${{ runner.temp }}/zero-windows.zip

name: zero-windows-build
# ZERO Windows uygulamasi (firefox.exe iceren zip) uretir.
# Kullanim: GitHub repo sayfasi -> Actions -> zero-windows-build -> Run workflow.
# Bitince Artifacts'tan zero-windows.zip indir, ac, firefox.exe calistir.
# NOT: imzasiz build oldugu icin SmartScreen uyarir -> "Run anyway" de.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360
    defaults:
      run:
        shell: powershell
    steps:
      - name: ZERO reposu
        uses: actions/checkout@v4
        with:
          path: zero

      - name: On dogrulama (fail-fast)
        run: |
          $ErrorActionPreference = 'Stop'
          $need = @(
            'zero/newtab/src/settings/schema.ts',
            'zero/newtab/src/settings/useZeroSettings.ts',
            'zero/newtab/src/lib/db.ts',
            'zero/newtab/src/components/VerticalTabs.tsx',
            'zero/newtab/src/components/tools/send.ts',
            'zero/newtab/src/components/tools/tezgahOps.ts',
            'zero/newtab/src/components/tools/Tezgah.tsx',
            'zero/newtab/src/components/tools/LinkFilter.tsx',
            'zero/newtab/src/components/tools/GunPlani.tsx',
            'zero/newtab/tests/pro.spec.ts',
            'zero/firefox-fork/src/browser/zero/ZeroMode.sys.mjs',
            'zero/firefox-fork/src/browser/zero/ZeroChrome.sys.mjs',
            'zero/firefox-fork/src/browser/zero/ZeroPrefs.sys.mjs',
            'zero/chrome/userChrome.css',
            'zero/chrome/userContent.css'
          )
          $missing = @($need | Where-Object { -not (Test-Path (Join-Path $env:GITHUB_WORKSPACE $_)) })
          if ($missing.Count -gt 0) { throw ('eksik dosyalar: ' + ($missing -join ', ')) }
          $mb = Get-Content "$env:GITHUB_WORKSPACE/zero/firefox-fork/src/browser/zero/moz.build" -Raw
          foreach ($f in @('ZeroMode.sys.mjs', 'ZeroChrome.sys.mjs', 'ZeroPrefs.sys.mjs')) {
            if ($mb -notmatch [regex]::Escape($f)) { throw "moz.build $f satiri yok" }
          }
          $uc = Get-Content "$env:GITHUB_WORKSPACE/zero/chrome/userChrome.css" -Raw
          if ($uc -notmatch 'zero-newtab') { throw 'userChrome zero-newtab kurali yok' }
          $mbext = Get-Content "$env:GITHUB_WORKSPACE/zero/firefox-fork/system-addon/zero-newtab/moz.build" -Raw
          if ($mbext -notmatch 'zero-newtab') { throw 'system-addon moz.build bozuk' }
          Write-Output 'on-dogrulama OK'

      - name: Arac kontrol (hg, node)
        run: |
          $ErrorActionPreference = 'Stop'
          where.exe hg
          hg --version
          node --version
          npm --version
          Test-Path "$env:GITHUB_WORKSPACE/zero/firefox-fork/mozconfig-windows" -ErrorAction Stop | Out-Null

      - name: Disk kontrolu (erken uyarı)
        run: |
          $ErrorActionPreference = 'Stop'
          $wsDrive = (Get-Item $env:GITHUB_WORKSPACE).PSDrive.Name
          $freeGB = [math]::Round((Get-PSDrive $wsDrive).Free / 1GB)
          Write-Output "workspace surucusu: $wsDrive, bos alan: $freeGB GB"
          Get-PSDrive -PSProvider FileSystem | Select-Object Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB)}} | Out-String | Write-Output
          if ($freeGB -lt 30) { throw "bos alan yetersiz ($freeGB GB < 30 GB). Workflow'u yeniden baslat (baska runner'a duser)." }

      - name: ESR kaynagi
        run: |
          $ErrorActionPreference = 'Stop'
          $ok = $false
          for ($i = 1; $i -le 3 -and -not $ok; $i++) {
            try {
              if (Test-Path firefox-esr) { Remove-Item -Recurse -Force firefox-esr }
              hg clone https://hg.mozilla.org/releases/mozilla-esr140 firefox-esr
              if (-not (Test-Path firefox-esr/browser/app/profile/firefox.js)) { throw 'clone eksik gorunuyor' }
              $ok = $true
            } catch {
              Write-Output "klon deneme $i basarisiz: $($_.Exception.Message)"
              if ($i -eq 3) { throw }
              Start-Sleep -Seconds 30
            }
          }
          hg --cwd firefox-esr id -i

      - name: Node kur (npm cache)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: zero/newtab/package-lock.json

      - name: Newtab derle + system addon iskeleti
        run: |
          $ErrorActionPreference = 'Stop'
          cd zero/newtab
          npm install --no-audit --no-fund
          npm run build
          if (-not (Test-Path dist/index.html)) { throw "newtab dist uretilmedi" }
          cd $env:GITHUB_WORKSPACE
          # System addon: derleme icine gomulur (dagitim klasoru zamanlama sorunlarini bitirir)
          $sa = 'firefox-esr/browser/extensions/zero-newtab/extension'
          New-Item -ItemType Directory -Force $sa | Out-Null
          Copy-Item zero/extension/manifest.json,zero/extension/background.js,zero/extension/newtab-override.js $sa -Force
          Copy-Item -Recurse zero/newtab/dist "$sa/dist" -Force
          Copy-Item zero/firefox-fork/system-addon/zero-newtab/moz.build,zero/firefox-fork/system-addon/zero-newtab/jar.mn firefox-esr/browser/extensions/zero-newtab/ -Force
          $mb = 'firefox-esr/browser/extensions/moz.build'
          $c = Get-Content $mb -Raw
          if ($c -notmatch '"zero-newtab"') {
            $c = $c -replace '"newtab",', ('"newtab",' + "`n" + '    "zero-newtab",')
            Set-Content $mb $c -NoNewline
          }
          if (-not (Select-String -Path $mb -Pattern '"zero-newtab"' -Quiet)) { throw "DIRS yamasi tutmadi" }
          if (-not (Test-Path "$sa/dist/index.html")) { throw "system addon dist eksik" }
          Write-Output "system addon iskelet OK"
          # ZERO platform modulu (derlemeye gomulu JS servisi)
          New-Item -ItemType Directory -Force firefox-esr/browser/zero | Out-Null
          Copy-Item zero/firefox-fork/src/browser/zero/*.sys.mjs firefox-esr/browser/zero/ -Force; if ($?) { Copy-Item zero/firefox-fork/src/browser/zero/moz.build firefox-esr/browser/zero/ -Force }
          $bm = 'firefox-esr/browser/moz.build'
          if ((Get-Content $bm -Raw) -notmatch 'DIRS \+= \["zero"\]') { Add-Content $bm 'DIRS += ["zero"]' }
          if (-not (Test-Path firefox-esr/browser/zero/ZeroMode.sys.mjs)) { throw "platform modulu kopyalanamadi" }
          if (-not (Test-Path firefox-esr/browser/zero/ZeroChrome.sys.mjs)) { throw "ZeroChrome kopyalanamadi" }

      - name: ZERO branding (PowerShell)
        run: |
          $ErrorActionPreference = 'Stop'
          $src = 'firefox-esr/browser/branding/official'
          $dst = 'firefox-esr/browser/branding/zero'
          if (-not (Test-Path "$src/locales/en-US/brand.properties")) { throw "official branding beklenmedik yapida" }
          Remove-Item -Recurse -Force $dst -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $dst | Out-Null
          Copy-Item "$src/*" $dst -Recurse -Force
          # Repo markasi uste biner: gosterim adi ZERO
          Copy-Item "$env:GITHUB_WORKSPACE/zero/firefox-fork/branding/zero/configure.sh" "$dst/configure.sh" -Force
          # ZERO ikon seti (tilki gider, halkali Z gelir)
          pip install pillow --quiet
          python "$env:GITHUB_WORKSPACE/zero/firefox-fork/scripts/make-icons.py" "$dst"
          if (-not (Test-Path "$dst/firefox.ico")) { throw "ikon uretilemedi" }
          Write-Output "branding + ikon OK"
          Get-ChildItem -Recurse -Path $dst -Include 'brand.*','*.dtd','*.ftl' | ForEach-Object {
            (Get-Content $_.FullName -Raw) -replace 'Firefox','ZERO' | Set-Content $_.FullName -NoNewline:$false
          }
          if (-not (Select-String -Path "$dst/locales/en-US/brand.properties" -Pattern 'ZERO' -Quiet)) { throw "branding sed tutmadi" }
          Write-Output "branding OK"

      - name: MozillaBuild kur
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path C:\mozilla-build)) {
            $dlOk = $false
            for ($i = 1; $i -le 3 -and -not $dlOk; $i++) {
              try {
                Invoke-WebRequest -Uri https://ftp.mozilla.org/pub/mozilla.org/mozilla/libraries/win32/MozillaBuildSetup-Latest.exe -OutFile $env:RUNNER_TEMP\mb-setup.exe
                $dlOk = $true
              } catch {
                Write-Output "mb indirme deneme $i basarisiz"
                if ($i -eq 3) { throw }
                Start-Sleep -Seconds 15
              }
            }
            Start-Process $env:RUNNER_TEMP\mb-setup.exe -ArgumentList '/S' -Wait
          }
          $bash = Get-ChildItem -Recurse -Path C:\mozilla-build -Filter bash.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\bin\\' } | Select-Object -First 1
          if (-not $bash) {
            Get-ChildItem C:\mozilla-build | Out-String | Write-Output
            throw "mozilla-build bash bulunamadi"
          }
          & $bash.FullName --version
          $bash.FullName | Set-Content $env:RUNNER_TEMP\moz-bash.txt
          Get-Content $env:RUNNER_TEMP\moz-bash.txt

      - name: Derle + paketle (MozillaBuild)
        run: |
          $ErrorActionPreference = 'Stop'
          # Git/msys/cygwin PATH'ten cikar: MozillaBuild msys DLL'iyle capisip fork patlatiyor
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notmatch 'Git|msys|cygwin|Strawberry|mingw' }) -join ';'
          $env:MOZILLABUILD = 'C:\mozilla-build'
          # mach'in shebang'i python3 ister; Windows Python'unda sadece python.exe var
          $mbPy = Get-ChildItem -Recurse -Path C:\mozilla-build -Filter python3.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($mbPy) {
            $env:PATH = "$($mbPy.DirectoryName);" + $env:PATH
          } else {
            $py12 = Get-ChildItem C:\hostedtoolcache\windows\Python\3.12*\x64\python.exe -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $py12) { throw "python3 icin kaynak bulunamadi" }
            Copy-Item $py12.FullName (Join-Path $py12.DirectoryName 'python3.exe') -Force
            $env:PATH = "$($py12.DirectoryName);" + $env:PATH
          }
          where.exe python3
          $bash = Get-Content $env:RUNNER_TEMP\moz-bash.txt
          $env:ZERO_WS = ($env:GITHUB_WORKSPACE -replace '\\','/')
          & $bash --login -c 'bash "$ZERO_WS/zero/firefox-fork/scripts/ci-windows-build.sh" "$ZERO_WS"' > "$env:RUNNER_TEMP/zero-build.log" 2>&1
          $code = $LASTEXITCODE
          Get-Content "$env:RUNNER_TEMP/zero-build.log" -Tail 60 | Out-String | Write-Output
          if ($code -ne 0) { throw "derleme patladi (exit $code) — tam log artifact'ta (zero-build-log)" }

      - name: Distribution ekle + yukle
        run: |
          $ErrorActionPreference = 'Stop'
          cd firefox-esr
          $zips = Get-ChildItem -Recurse obj-zero/dist -Filter "*.zip"
          $zips | Select-Object Name, Length | Out-String | Write-Output
          $zip = $zips | Where-Object { $_.Name -notmatch 'xpt|artifact' -and $_.Name -match '^(firefox|zero)-' } | Select-Object -First 1
          if (-not $zip) { $zip = $zips | Where-Object { $_.Name -notmatch 'xpt|artifact' } | Select-Object -First 1 }
          if (-not $zip) { throw "paket zip bulunamadi" }
          $tmp = "$env:RUNNER_TEMP/zero-pkg"
          Remove-Item -Recurse -Force $tmp -ErrorAction SilentlyContinue
          Expand-Archive $zip.FullName $tmp
          $exe = Get-ChildItem -Recurse $tmp -Filter "zero.exe" | Select-Object -First 1
          if (-not $exe) { $exe = Get-ChildItem -Recurse $tmp -Filter "firefox.exe" | Select-Object -First 1 }
          if (-not $exe) { Get-ChildItem $tmp; throw "pakette calistirilabilir yok" }
          $fw = $exe.Directory
          # Politika (kanitli calisiyor)
          New-Item -ItemType Directory -Force "$($fw.FullName)/distribution" | Out-Null
          Set-Content "$($fw.FullName)/distribution/policies.json" @'
          {
            "policies": {
              "DisableTelemetry": true,
              "DisableFirefoxStudies": true,
              "DisablePocket": true,
              "DontCheckDefaultBrowser": true,
              "OverrideFirstRunPage": "about:newtab",
              "OverridePostUpdatePage": "",
              "SearchEngines": { "Default": "DuckDuckGo" },
              "Homepage": { "URL": "about:newtab", "Locked": false }
            }
          }
          '@
          # Varsayilan profile siyah tema: her yeni ZERO profiliyle gelir
          $profChrome = "$($fw.FullName)/browser/defaults/profile/chrome"
          New-Item -ItemType Directory -Force $profChrome | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE/zero/chrome/userChrome.css","$env:GITHUB_WORKSPACE/zero/chrome/userContent.css" $profChrome -Force
          if (-not (Test-Path "$profChrome/userChrome.css")) { throw "tema kopyalanamadi" }
          # Yedek katman: autoconfig ilk acilista temayi profile yazar (dis cerceve garantisi)
          $themeDir = "$($fw.FullName)/browser/zero-theme"
          New-Item -ItemType Directory -Force $themeDir | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE/zero/chrome/userChrome.css","$env:GITHUB_WORKSPACE/zero/chrome/userContent.css" $themeDir -Force
          New-Item -ItemType Directory -Force "$($fw.FullName)/defaults/pref" | Out-Null
          Set-Content "$($fw.FullName)/defaults/pref/autoconfig.js" @'
          pref("general.config.filename", "mozilla.cfg");
          pref("general.config.obscure_value", 0);
          '@
          Set-Content "$($fw.FullName)/mozilla.cfg" @'
          // ZERO tema bootstrap: ilk acilista chrome dosyalarini profile kopyalar.
          (function () {
            try {
              var Cc = Components.classes;
              var Ci = Components.interfaces;
              Components.utils.import("resource://gre/modules/Services.jsm");
              var profChrome = Services.dirsvc.get("ProfD", Ci.nsIFile);
              profChrome.append("chrome");
              if (!profChrome.exists()) profChrome.create(Ci.nsIFile.DIRECTORY_TYPE, 0o755);
              var need = [];
              ["userChrome.css", "userContent.css"].forEach(function (n) {
                var f = profChrome.clone(); f.append(n);
                if (!f.exists()) need.push(n);
              });
              if (!need.length) return;
              var theme = Services.dirsvc.get("GreD", Ci.nsIFile);
              theme.append("browser"); theme.append("zero-theme");
              need.forEach(function (n) {
                var src = theme.clone(); src.append(n);
                if (src.exists()) src.copyTo(profChrome, "");
              });
            } catch (e) {}
          })();
          // ZERO chrome bootstrap: newtab aktifken native bari gizle (Zen-tarzi).
          // ZeroChrome omni.ja icinde yoksa sessizce atla (artifact build toleransi).
          try {
            var zc = ChromeUtils.importESModule("resource://app/modules/zero/ZeroChrome.sys.mjs");
            var wm2 = Components.classes["@mozilla.org/appshell/window-mediator;1"].getService(Components.interfaces.nsIWindowMediator);
            var _hook = function(w) { try { zc.ZeroChrome.init(w); } catch (e) {} };
            var _en = wm2.getEnumerator("navigator:browser");
            while (_en.hasMoreElements()) _hook(_en.getNext().QueryInterface(Components.interfaces.nsIDOMWindow));
            Services.obs.addObserver(function(w) { _hook(w); }, "browser-delayed-startup-finished");
          } catch (e) {}
          '@
          if (-not (Test-Path "$($fw.FullName)/mozilla.cfg")) { throw "autoconfig yazilamadi" }
          Write-Output "tema + politika + autoconfig OK"
          Compress-Archive -Path "$($fw.FullName)" -DestinationPath "$env:RUNNER_TEMP/zero-windows.zip" -Force
          $size = (Get-Item "$env:RUNNER_TEMP/zero-windows.zip").Length
          Write-Output "zero-windows.zip: $([math]::Round($size/1MB)) MB"
          if ($size -lt 50MB) { throw "paket supheli derecede kucuk ($size bayt)" }
          cd $env:GITHUB_WORKSPACE

      - name: SHA256
        if: success()
        run: |
          $ErrorActionPreference = 'Stop'
          (Get-FileHash "${{ runner.temp }}/zero-windows.zip" -Algorithm SHA256).Hash | Set-Content "${{ runner.temp }}/zero-windows.zip.sha256"
          Get-Content "${{ runner.temp }}/zero-windows.zip.sha256"

      - name: Yukle (zip+sha)
        uses: actions/upload-artifact@v4
        with:
          name: zero-windows
          path: |
            ${{ runner.temp }}/zero-windows.zip
            ${{ runner.temp }}/zero-windows.zip.sha256

      - name: Yukle (build log)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zero-build-log
          path: ${{ runner.temp }}/zero-build.log
          if-no-files-found: warn
